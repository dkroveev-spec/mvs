name: secret-check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Decode LOCAL_PROPERTIES
        env:
          LP: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          if [ -z "$LP" ]; then echo "SECRET EMPTY"; exit 1; fi
          echo "$LP" | base64 -d > /tmp/lp
          echo "bytes=$(wc -c < /tmp/lp)"
          echo "keys=$(cut -d= -f1 /tmp/lp | tr '\n' ' ')"
          APP_ID=$(grep '^TELEGRAM_APP_ID=' /tmp/lp | cut -d= -f2)
          HASH=$(grep '^TELEGRAM_APP_HASH=' /tmp/lp | cut -d= -f2)
          echo "app_id_len=${#APP_ID}"
          echo "hash_len=${#HASH}"
